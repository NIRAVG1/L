services:
  - type: web
    name: lyftr-ai-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    disk:
      name: lyftr-ai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "false"
      - key: DEFAULT_SYSTEM_PROMPT
        value: You are a helpful AI assistant.
